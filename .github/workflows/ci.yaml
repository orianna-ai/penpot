name: ci
on:
  workflow_dispatch:
  push:
    branches:
      - develop
defaults:
  run:
    shell: bash
jobs:
  docker:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ./manage.sh build-bundle
      - run: ./manage.sh build-docker-images
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: orianna-ai
          password: ${{ github.token }}
      - run: docker tag penpotapp/backend:latest ghcr.io/orianna-ai/penpot-backend:latest
      - run: docker push ghcr.io/orianna-ai/penpot-backend:latest
      - run: docker tag penpotapp/exporter:latest ghcr.io/orianna-ai/penpot-exporter:latest
      - run: docker push ghcr.io/orianna-ai/penpot-exporter:latest
      - run: docker tag penpotapp/frontend:latest ghcr.io/orianna-ai/penpot-frontend:latest
      - run: docker push ghcr.io/orianna-ai/penpot-frontend:latest
